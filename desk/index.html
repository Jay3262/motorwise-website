<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motorwise Desk</title>
<meta name="theme-color" content="#101F32">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MW Desk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Atkinson";src:url(fonts/AtkinsonHyperlegibleNext-400.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson";src:url(fonts/AtkinsonHyperlegibleNext-700.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Atkinson";src:url(fonts/AtkinsonHyperlegibleNext-800.ttf) format("truetype");font-weight:800;font-display:swap}
:root{
  --navy:#101F32;--navy-2:#1B2E47;--teal:#087C70;--teal-d:#066359;--mint:#A9E6D8;--mint-l:#E3F6F1;
  --grey:#F3F6F7;--line:#DCE3E7;--ink:#101F32;--ink-2:#4A5A6B;--white:#fff;
  --red:#B3261E;--red-l:#FBE9E7;--amber:#8A5A00;--amber-l:#FFF3D6;
  --r:12px;--r-s:8px;
  --fs-s:14px;--fs-b:16px;--fs-m:18px;--fs-l:22px;--fs-xl:28px;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html{scroll-padding-top:72px;scroll-padding-bottom:96px}
[hidden]{display:none!important}
html,body{margin:0;background:var(--grey);color:var(--ink);font-family:"Atkinson",system-ui,-apple-system,sans-serif;font-size:var(--fs-b);line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding-bottom:calc(76px + var(--sab))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal-d)}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:var(--fs-l);font-weight:800}
h2{font-size:var(--fs-m);font-weight:800}
h3{font-size:var(--fs-b);font-weight:700}
p{margin:0}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 12px;display:flex;align-items:center;gap:12px;min-height:56px}
.top h1{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{background:none;border:0;color:#fff;font-size:16px;padding:8px 8px 8px 0;min-height:44px;display:flex;align-items:center;gap:4px;cursor:pointer}
.top .who{font-size:var(--fs-s);color:var(--mint);background:none;border:0;padding:8px 0;min-height:44px;cursor:pointer}
.sample{background:var(--amber-l);color:var(--amber);font-size:var(--fs-s);padding:8px 16px;font-weight:700;border-bottom:1px solid #F1DDA8}
main{padding:16px;max-width:760px;margin:0 auto;display:grid;gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.panel.tight{padding:0;gap:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-2);font-size:var(--fs-s)}
.small{font-size:var(--fs-s)}
.num{font-variant-numeric:tabular-nums}
.big{font-size:var(--fs-xl);font-weight:800;font-variant-numeric:tabular-nums}
.list>*{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit;min-height:60px;background:#fff;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.list>*:first-child{border-top:0}
.list .t{font-weight:700}
.list .s{font-size:var(--fs-s);color:var(--ink-2)}
.chev{color:var(--ink-2);font-size:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:active{background:var(--teal-d)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red);border-color:#E8BDB9}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick a{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:96px;padding:14px;border-radius:var(--r);background:var(--navy);color:#fff;text-decoration:none;font-weight:800;font-size:var(--fs-m)}
.quick a svg{width:28px;height:28px;stroke:var(--mint)}
.quick a:nth-child(4){background:var(--teal)}
.quick a:nth-child(4) svg{stroke:#fff}
label.f{display:grid;gap:6px;font-size:var(--fs-s);font-weight:700;color:var(--ink-2)}
label.f .hint{font-weight:400}
input.i,select.i,textarea.i{width:100%;min-height:48px;padding:10px 12px;border:1px solid #BFCBD2;border-radius:var(--r-s);background:#fff;font-size:16px;color:var(--ink);font-weight:400}
textarea.i{min-height:96px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus,.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--mint);outline-offset:1px}
.plate{display:inline-block;background:#F7D117;color:#111;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:4px;font-size:var(--fs-s);border:1px solid #C9A800;white-space:nowrap}
input.plate-in{background:#F7D117;font-weight:800;font-size:24px;letter-spacing:.08em;text-transform:uppercase;text-align:center;border-color:#C9A800}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--grey);color:var(--ink-2);white-space:nowrap}
.tag.preparing,.tag.new{background:var(--amber-l);color:var(--amber)}
.tag.available,.tag.replied,.tag.sent{background:var(--mint-l);color:var(--teal-d)}
.tag.reserved,.tag.viewing_booked,.tag.prepared{background:#E4ECF7;color:#1E4C8A}
.tag.sold{background:var(--navy);color:#fff}
.tag.closed{background:var(--grey);color:var(--ink-2)}
.tag.failed,.tag.draft{background:var(--red-l);color:var(--red)}
.tag.sample-t{background:var(--amber-l);color:var(--amber)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:var(--fs-s);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.thumb{width:64px;height:48px;border-radius:6px;background:var(--grey) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--ink-2);font-size:11px;border:1px solid var(--line)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:4/3;border-radius:8px;background:var(--grey) center/cover no-repeat;border:1px solid var(--line);overflow:hidden}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(16,31,50,.78);color:#fff;font-size:11px;padding:3px 6px;display:flex;justify-content:space-between}
.ph .cover{position:absolute;top:6px;left:6px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px}
.ph button{position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:transparent;cursor:pointer}
.ph button span{display:block;margin:6px 6px auto auto;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);line-height:28px;text-align:center;font-weight:800}
.check{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.check div{text-align:center;font-size:11px;font-weight:700;padding:8px 2px;border-radius:8px;background:var(--grey);color:var(--ink-2)}
.check div.ok{background:var(--mint-l);color:var(--teal-d)}
.calc{font-size:var(--fs-s);background:var(--grey);border-radius:var(--r-s);padding:10px 12px;display:grid;gap:4px}
.calc .l{display:flex;justify-content:space-between;gap:12px}
.calc .l.tot{border-top:1px solid var(--line);padding-top:6px;font-weight:800;font-size:var(--fs-b)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.kpi{color:inherit;text-decoration:none}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:2px}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k{font-size:var(--fs-s);color:var(--ink-2);font-weight:700}
.flag{border-left:4px solid var(--amber);background:var(--amber-l);padding:10px 12px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:var(--fs-s);display:grid;gap:6px}
.flag.red{border-color:var(--red);background:var(--red-l)}
.flag.ok{border-color:var(--teal);background:var(--mint-l)}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--teal)}
.sig{width:100%;height:160px;border:1px dashed #9AAAB5;border-radius:var(--r-s);background:#fff;touch-action:none;display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--sab)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;font-size:12px;font-weight:700;color:var(--ink-2);text-decoration:none}
.tabs a svg{width:24px;height:24px;stroke:currentColor}
.tabs a[aria-current=page]{color:var(--teal-d)}
.tabs a[aria-current=page] svg{stroke:var(--teal)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + var(--sab));z-index:50;background:var(--navy);color:#fff;padding:14px 16px;border-radius:var(--r);font-weight:700;box-shadow:0 6px 24px rgba(16,31,50,.25);max-width:560px;margin:0 auto}
.toast.err{background:var(--red)}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(16,31,50,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#fff;width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--sab));display:grid;gap:12px}
.login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--navy);color:#fff}
.login .card{width:100%;max-width:380px;display:grid;gap:14px}
.login .card .panel,.login .flag{color:var(--ink)}
.empty{text-align:center;color:var(--ink-2);padding:24px 16px;font-size:var(--fs-s)}
.pack-frame{width:100%;height:70dvh;border:1px solid var(--line);border-radius:var(--r-s);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
table.t th,table.t td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
@media (min-width:700px){.quick{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}.photos{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
.savestate{font-size:12px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}.savestate.ok{color:var(--mint)}.savestate.bad{background:#b42318;color:#fff}
.webstate{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dot{width:10px;height:10px;border-radius:50%;background:#98a2b3;display:inline-block}.dot.on{background:#12b76a}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding:8px 0 0;border-bottom:1px solid var(--line,#ddd)}.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}.bars i{display:block;width:100%;border-radius:4px 4px 0 0;background:#087C70}.bars i.neg{background:#d92d20}.bars i.proj{background:repeating-linear-gradient(45deg,#A9E6D8,#A9E6D8 4px,#cfeee6 4px,#cfeee6 8px)}.bars small{font-size:11px;color:var(--muted,#667085)}.bars b{font-size:11px}
.t td.neg,.num.neg{color:#d92d20}

/* ===== desktop: sidebar app ===== */
.brand{display:none}
.cols{display:grid;gap:16px;align-content:start}.col{display:grid;gap:16px;align-content:start;min-width:0}
.syncbar{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);z-index:70;background:var(--teal);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:92vw;text-align:center}
@media (min-width:1024px){
 body{padding-bottom:0;padding-left:248px}
 .brand{display:flex;position:fixed;left:0;top:0;width:248px;height:76px;z-index:31;align-items:center;gap:12px;padding:0 22px;background:var(--navy);color:#fff}
 .brand img{border-radius:9px}.brand b{display:block;font-size:18px;line-height:1.1}.brand span{color:var(--mint);font-size:13px;font-weight:700}
 .tabs{left:0;top:0;bottom:0;right:auto;width:248px;border-top:0;background:var(--navy);display:flex;flex-direction:column;gap:4px;padding:92px 14px 20px}
 .tabs a{flex-direction:row;justify-content:flex-start;gap:14px;min-height:48px;padding:0 14px;border-radius:10px;font-size:15px;color:#c9d4e2}
 .tabs a svg{stroke:#8fa3bb}
 .tabs a:hover{background:rgba(255,255,255,.07);color:#fff}
 .tabs a[aria-current=page]{background:var(--teal);color:#fff}.tabs a[aria-current=page] svg{stroke:#fff}
 .top{position:sticky;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:0 32px;min-height:76px}
 .top h1{font-size:24px}
 .top .back{color:var(--ink)}.top .back svg{stroke:var(--ink)}
 .top .who{color:var(--teal-d);font-weight:700}
 .savestate{background:var(--grey);color:var(--ink-2)}.savestate.ok{color:var(--teal-d)}
 main{max-width:1320px;padding:28px 32px 48px;gap:20px}
 .cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
 .cols.today{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
 .cols.today .quick{grid-template-columns:1fr 1fr}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .photos{grid-template-columns:repeat(4,1fr)}
 .panel{padding:20px}
 /* stock as a photo grid */
 [data-route=cars] .panel.tight{background:none;border:0;padding:0}
 [data-route=cars] .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
 [data-route=cars] .list>a{flex-direction:column;align-items:stretch;gap:10px;padding:0 0 14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:box-shadow .2s,transform .2s}
 [data-route=cars] .list>a:hover{box-shadow:0 12px 30px -12px rgba(16,31,50,.35);transform:translateY(-2px)}
 [data-route=cars] .list .thumb{width:100%;height:auto;aspect-ratio:4/3;border-radius:0}
 [data-route=cars] .list .grow,[data-route=cars] .list .tag{margin:0 14px}
 [data-route=cars] .list .tag{align-self:flex-start}
 main>a.btn.primary.block{justify-self:start;width:auto;padding:0 32px}
 .sheet{align-items:center}.sheet>div{border-radius:16px;max-height:86vh}
 .chips{flex-wrap:wrap;overflow:visible}
}
.tag.sor{background:#efe7ff;color:#5b21b6;border:1px solid #d8c8ff}
.sorbox{background:#f6f1ff;border-left-color:#7c3aed}
</style>
</head>
<body>
<div id="app"><div class="login"><p>Loading Motorwise Desk…</p></div></div>
<noscript>Motorwise Desk needs JavaScript turned on.</noscript>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
